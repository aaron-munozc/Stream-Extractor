[package]
name = "stream_extractor"
version = "0.1.0"
edition = "2024"

[features]
default = ["reqwest-backend"]

# HTTP back-ends (mutually exclusive)
reqwest-backend = ["dep:reqwest"]
wreq-backend    = ["dep:wreq", "dep:wreq-util"]

# VOD/clip video downloading (requires ffmpeg at runtime)
vod = ["dep:tempfile", "dep:m3u8-rs"]

# Adds Serialize + Deserialize to all public info types and enums.
# Pull in serde yourself if you need it in your own crate.
serde-types = ["chrono/serde"]

[dependencies]
thiserror    = "2.0.18"
url          = "2.5.8"
log          = "0.4.30"
regex        = "1.12.3"
urlencoding  = "2.1.3"
futures      = "0.3.32"
tokio        = { version = "1.52.3", features = ["full"] }
chrono       = "0.4.44"
rand         = "0.10.1"
dirs         = "6.0.0"

serde        = { version = "1.0.228", features = ["derive"] }
serde_json   = { version = "1.0.150" }

# VOD downloader
tempfile = { version = "3.27.0", optional = true }
m3u8-rs  = { version = "6.0.0",  optional = true }

# HTTP back-ends
reqwest  = { version = "0.13.4",      features = ["json", "cookies", "stream"], optional = true }
wreq     = { version = "6.0.0-rc.29", features = ["json", "cookies", "stream"], optional = true }
wreq-util = { version = "3.0.0-rc.13", features = [], optional = true }